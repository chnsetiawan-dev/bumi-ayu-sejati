<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kentang Brokoli</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#1b2430;--mut:#6b7686;--line:#e3e7ee;--pri:#1f5fbf;--ok:#1e8a4c;--warn:#c98a00;--bad:#c62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink)}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:16px}header small{opacity:.85}header button{background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:6px 10px}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:6px 8px;position:sticky;top:52px;z-index:4}
nav a{white-space:nowrap;padding:7px 12px;border-radius:99px;color:var(--mut);text-decoration:none;font-weight:600;font-size:13px}
nav a.on{background:var(--pri);color:#fff}
main{max-width:1000px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.stat small{color:var(--mut)}.stat b{display:block;font-size:18px}
.cols{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:800px){.cols{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}td.r,th.r{text-align:right}.scroll{overflow-x:auto}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#e6eefb;color:var(--pri);white-space:nowrap}
.tag.ok{background:#e3f4ea;color:var(--ok)}.tag.warn{background:#fdf3d8;color:var(--warn)}.tag.bad{background:#fde5e5;color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.alert{background:#fff7e0;border:1px solid #f0d58a;border-radius:10px;padding:8px 10px;margin-bottom:8px}.alert.bad{background:#fdecec;border-color:#f2b8b8}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
button{font:inherit;cursor:pointer}.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:700}
.btn.sm{padding:5px 10px;font-size:12px}.btn.ghost{background:#eef2f8;color:var(--ink)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.full{width:100%}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:center}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:700}
.qty input{width:70px;text-align:center;padding:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{padding:6px 12px;border:1px solid var(--line);border-radius:99px;font-size:12px;background:#fff}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px;margin:0 -12px -12px;border-radius:0 0 12px 12px}
.mut{color:var(--mut)}.k{font-family:ui-monospace,monospace;letter-spacing:2px}.red{color:var(--bad)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.login{max-width:360px;margin:60px auto}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:9}
pre{white-space:pre-wrap;background:#f5f7fa;padding:10px;border-radius:10px}
dialog{border:0;border-radius:14px;max-width:560px;width:94%;padding:16px}dialog::backdrop{background:#0006}
</style></head><body>
<div id="app"></div>
<script>
let TOKEN = localStorage.tok || '', ME = null, VIEW = '';
const $ = s => document.querySelector(s);
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const num = n => (+n || 0).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const toast = m => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.append(d); setTimeout(() => d.remove(), 2600); };
async function api(p, body) {
  const r = await fetch('/api/' + p, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN }, body: body && JSON.stringify(body) });
  const j = await r.json();
  if (r.status === 401 && p !== 'login') { logout(); throw new Error(j.error); }
  if (!r.ok) { toast(j.error); throw new Error(j.error); }
  return j;
}
const STATUS = { pending: ['Menunggu persetujuan', 'warn'], approved: ['Siap kirim', ''], shipped: ['Terkirim', 'ok'], rejected: ['Ditolak', 'bad'] };
const st = s => `<span class="tag ${STATUS[s][1]}">${STATUS[s][0]}</span>`;

const MENUS = {
  owner: [['pantau', 'Pantauan'], ['setuju', 'Persetujuan'], ['piutang', 'Piutang'], ['kpi', 'KPI'], ['orders', 'Order'], ['baru', '+ Order'],
    ['pelanggan', 'Pelanggan'], ['harga', 'Harga & Stok'], ['target', 'Target'], ['retur', 'Retur'], ['disiplin', 'Disiplin'], ['rekap', 'Rekap'], ['lain', 'Ekspor & Log']],
  admin: [['harga', 'Harga & Stok'], ['pelanggan', 'Pelanggan'], ['orders', 'Order'], ['baru', '+ Order'], ['retur', 'Retur'], ['target', 'Kuota'],
    ['disiplin', 'Disiplin'], ['produk', 'Produk'], ['piutang', 'Piutang'], ['rekap', 'Rekap'], ['lain', 'Ekspor & Log']],
  sales: [['baru', '+ Order'], ['pantau', 'Ringkasan'], ['orders', 'Order Saya'], ['pelanggan', 'Pelanggan'], ['kontak', 'Kontak'], ['piutang', 'Piutang'], ['kpi', 'KPI'], ['retur', 'Retur']],
  finance: [['piutang', 'Piutang & Penerimaan'], ['orders', 'Nota'], ['rekap', 'Rekap'], ['lain', 'Ekspor']],
  warehouse: [['kirim', 'Siap Kirim'], ['harga', 'Stok Pagi'], ['orders', 'Semua Order']],
};

function logout() { TOKEN = ''; localStorage.removeItem('tok'); ME = null; render(); }
async function render() {
  if (!TOKEN) return loginView();
  if (!ME) try { ME = await api('me'); } catch { return; }
  const menu = MENUS[ME.role];
  VIEW = location.hash.slice(1) || menu[0][0];
  $('#app').innerHTML = `<header><div><b>Kentang Brokoli</b><br><small>${esc(ME.name)} · ${new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' })}</small></div>
    <button onclick="logout()">Keluar</button></header>
    <nav>${menu.map(([k, l]) => `<a href="#${k}" class="${k === VIEW ? 'on' : ''}">${l}</a>`).join('')}</nav><main id="main">Memuat…</main>`;
  try { await (V[VIEW] || V.pantau)(); } catch (e) { $('#main').innerHTML = `<div class="alert bad">${esc(e.message)}</div>`; }
}
window.onhashchange = render;

async function loginView() {
  const users = await api('users');
  const roleName = { owner: 'Pemilik', admin: 'Admin', sales: 'Sales', finance: 'Keuangan', warehouse: 'Gudang' };
  $('#app').innerHTML = `<div class="login card"><h2 style="margin-top:0">Kentang Brokoli</h2>
    <label>Pengguna</label><select id="u">${users.map(u => `<option value="${u.username}">${esc(u.name)} — ${roleName[u.role]}</option>`).join('')}</select>
    <label>Password</label><input id="p" type="password" autocomplete="current-password">
    <button class="btn full" id="go">Masuk</button></div>`;
  $('#go').onclick = async () => { const r = await api('login', { username: $('#u').value, pin: $('#p').value }); TOKEN = r.token; localStorage.tok = TOKEN; ME = r.user; location.hash = ''; render(); };
}

const V = {};
// ---------- Pantauan ----------
V.pantau = async () => {
  const d = await api('dashboard');
  const tot = d.todayBySales.reduce((a, r) => a + r.rp, 0);
  const ag = d.aging, sum = ag.belum + ag['1-7'] + ag['>7'] || 1;
  const pend = d.pending.length + d.pendingCust.length;
  $('#main').innerHTML = `
  ${pend && ME.role === 'owner' ? `<a href="#setuju" style="text-decoration:none;color:inherit"><div class="alert bad"><b>${pend} menunggu persetujuan</b> · ${d.pending.length} order, ${d.pendingCust.length} pelanggan baru →</div></a>` : ''}
  <div class="grid">
    <div class="stat"><small>Penjualan hari ini</small><b>${rp(tot)}</b><small>${d.todayBySales.reduce((a, r) => a + r.nota, 0)} nota</small></div>
    <div class="stat"><small>Belum dikirim</small><b>${d.unshipped} order</b></div>
    <div class="stat"><small>Piutang</small><b>${rp(d.total)}</b><small class="red">${rp(ag['>7'])} lewat &gt;7 hr</small></div>
    <div class="stat"><small>Pelanggan tidur</small><b>${d.sleeping.length}</b><small>&gt;14 hari tidak order</small></div>
  </div>
  <div class="cols">
    <div class="card"><h3>Hari ini · per sales</h3><table>${d.todayBySales.map(r => `<tr><td>${esc(r.name || 'Akun pemilik')}</td><td class="r">${r.nota} nota</td><td class="r"><b>${rp(r.rp)}</b></td></tr>`).join('') || '<tr><td class="mut">Belum ada</td></tr>'}</table></div>
    <div class="card"><h3>Hari ini · per produk</h3><table>${d.todayByProduct.map(r => `<tr><td>${esc(r.code)}</td><td class="r">${num(r.qty)} ${r.unit}</td><td class="r">${rp(r.rp)}</td></tr>`).join('') || '<tr><td class="mut">Belum ada</td></tr>'}</table></div>
    <div class="card"><h3>Bulan ini · omzet vs target</h3>${d.kpi.map(k => `<div class="row" style="justify-content:space-between"><span>${esc(k.name)}</span><span>${rp(k.net)} · <b>${k.pct.toFixed(0)}%</b></span></div>
      <div class="bar" style="margin:4px 0 10px"><i style="width:${Math.min(100, k.pct)}%;background:${k.pct >= 100 ? 'var(--ok)' : k.pct >= 80 ? 'var(--pri)' : 'var(--warn)'}"></i></div>`).join('')}</div>
    <div class="card"><h3>Piutang · ${rp(d.total)}</h3>
      <div style="display:flex;height:12px;border-radius:9px;overflow:hidden;margin-bottom:8px"><i style="width:${ag.belum / sum * 100}%;background:var(--ok)"></i><i style="width:${ag['1-7'] / sum * 100}%;background:var(--warn)"></i><i style="width:${ag['>7'] / sum * 100}%;background:var(--bad)"></i></div>
      <table><tr><td>Belum jatuh tempo</td><td class="r">${rp(ag.belum)}</td></tr><tr><td>Lewat 1–7 hari</td><td class="r">${rp(ag['1-7'])}</td></tr><tr class="red"><td>Lewat &gt;7 hari</td><td class="r"><b>${rp(ag['>7'])}</b></td></tr></table>
      <a href="#piutang" class="mut" style="font-size:12px">Lihat per pelanggan →</a></div>
    <div class="card"><h3>Kartu KPI · bulan ini (sementara)</h3>${kpiTable(d.kpi)}</div>
    <div class="card"><h3>Stok pagi & produk prioritas</h3><div class="scroll"><table><tr><th>Produk</th><th class="r">Stok</th><th class="r">Laku hari ini</th><th class="r">Sisa kuota bln</th></tr>
      ${d.stock.map(s => `<tr><td>${s.priority ? '⭐ ' : ''}${esc(s.code)}</td><td class="r">${num(s.stock)} ${s.unit}</td><td class="r">${num(s.sold_today)}</td><td class="r">${s.quota ? num(Math.max(0, s.quota - s.sold_month)) : '–'}</td></tr>`).join('')}</table></div></div>
    <div class="card"><h3>Pelanggan tidur (&gt;14 hari)</h3><table>${d.sleeping.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.sales || 'Pemilik')}</td><td class="r mut">${c.last || 'belum pernah'}</td></tr>`).join('') || '<tr><td class="mut">Tidak ada</td></tr>'}</table></div>
  </div>`;
};
const kpiTable = k => `<div class="scroll"><table><tr><th>Sales</th><th>Omzet · Prior · Baru · Disiplin · Piutang</th><th class="r">Pengali</th></tr>
  ${k.map(x => `<tr><td>${esc(x.name)}</td><td class="k">${x.checks.map(c => `<span title="${esc(c.k + ': ' + c.v)}" style="color:${c.ok ? 'var(--ok)' : 'var(--bad)'}">${c.ok ? '✓' : '✗'}</span>`).join('')} <span class="mut" style="letter-spacing:0">${x.n}/5</span></td>
  <td class="r"><span class="tag ${x.mult >= 1 ? 'ok' : x.mult ? 'warn' : 'bad'}">×${String(x.mult).replace('.', ',')}</span></td></tr>`).join('')}</table></div>`;

V.kpi = async () => {
  const k = await api('kpi');
  $('#main').innerHTML = `<div class="card"><h3>KPI ${new Date().toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })}</h3>
  <p class="mut" style="margin-top:0">Dihitung otomatis; nilai final dikunci di akhir bulan. Pengali: 5 = 1,5 · 4 = 1 · 3 = 0,5 · 0–2 = 0.</p></div>
  ${k.map(x => `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(x.name)}</b><span><span class="tag ${x.mult >= 1 ? 'ok' : x.mult ? 'warn' : 'bad'}">${x.n}/5 · ×${String(x.mult).replace('.', ',')}</span> ${x.bonus ? '· bonus ' + rp(x.bonus) : ''}</span></div>
  <table>${x.checks.map((c, i) => `<tr><td>${c.ok ? '✅' : '❌'} ${i + 1}. ${c.k}</td><td class="r mut">${esc(c.v)}</td></tr>`).join('')}</table></div>`).join('')}`;
};

// ---------- Order baru ----------
V.baru = async () => {
  const [cust, prices] = await Promise.all([api('customers'), api('prices')]);
  const ok = cust.filter(c => c.approved);
  let C = null, filter = 'all', pay = 'cash';
  const cart = {};
  const draw = () => {
    const list = prices.filter(p => filter === 'all' || (filter === 'prio' ? p.priority : p.code.startsWith(filter)));
    const total = Object.entries(cart).reduce((a, [id, v]) => { const p = prices.find(x => x.product_id == id); return a + (C ? (p[C.price_group] - (v.disc || 0)) * (v.qty || 0) : 0); }, 0);
    const warns = [];
    if (C) {
      if (C.maxLate > 7) warns.push(`Pelanggan menunggak ${C.maxLate} hari — order perlu persetujuan Pak Benny`);
      if (pay === 'tempo' && C.isNew) warns.push('Pelanggan baru wajib cash — tempo perlu persetujuan Pak Benny');
      Object.entries(cart).forEach(([id, v]) => { const p = prices.find(x => x.product_id == id); const max = { butir: 100, kg: 500 }[p.unit];
        if (max != null && v.disc > max && v.qty) warns.push(`Potongan ${p.code} Rp ${v.disc}/${p.unit} melebihi batas Rp ${max} — perlu persetujuan`); });
    }
    $('#main').innerHTML = `<div class="card"><h3>Pelanggan</h3>
      ${C ? `<div class="row" style="justify-content:space-between"><b style="font-size:16px">${esc(C.name)}</b><button class="btn sm ghost" id="cx">Ganti</button></div>` :
        `<input id="cs" placeholder="🔍 Ketik nama pelanggan…" autocomplete="off"><div id="cl" style="max-height:320px;overflow:auto"></div>`}
      ${C ? `<p class="mut" style="margin:6px 0 0">${esc(C.channel)} · harga ${C.price_group} · tempo ${C.tempo_days} hari ${C.isNew ? '· <span class="tag warn">baru</span>' : ''}</p>
      ${C.piutang ? `<div class="alert ${C.maxLate > 7 ? 'bad' : ''}" style="margin-top:6px">Piutang berjalan ${rp(C.piutang)}${C.maxLate > 0 ? ` · telat ${C.maxLate} hari` : ''}</div>` : ''}` : ''}</div>
    ${C ? `<div class="card"><h3>Produk · harga hari ini</h3>
      <div class="chips">${[['all', 'Semua'], ['prio', '⭐ Prioritas'], ['AK', 'AK'], ['B', 'BA/BS'], ['PYH', 'Puyuh']].map(([k, l]) => `<button class="chip ${filter === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
      <input id="ps" placeholder="🔍 Cari produk (kode / nama)…" autocomplete="off" style="margin-bottom:4px">
      ${list.map(p => { const v = cart[p.product_id] || {}; return `<div class="item" data-name="${esc((p.code + ' ' + p.name).toLowerCase())}"><div><b>${p.priority ? '⭐ ' : ''}${esc(p.name)}</b><br><small class="mut">${rp(p[C.price_group])}/${p.unit}${p.stock != null ? ' · stok ' + num(p.stock) : ''}</small>
        ${v.qty ? `<br><small>Potongan Rp/${p.unit}: <input data-d="${p.product_id}" value="${v.disc || ''}" inputmode="numeric" style="width:80px;padding:4px"></small>` : ''}</div>
        <div class="qty"><button data-m="${p.product_id}">−</button><input data-q="${p.product_id}" value="${v.qty || ''}" inputmode="numeric" placeholder="0"><button data-p="${p.product_id}">+</button></div></div>`; }).join('')}
    </div>
    <div class="card"><h3>Pembayaran & kirim</h3>
      <div class="chips"><button class="chip ${pay === 'cash' ? 'on' : ''}" data-pay="cash">Cash</button><button class="chip ${pay === 'tempo' ? 'on' : ''}" data-pay="tempo">Tempo ${C.tempo_days} hari</button></div>
      <label>Tanggal kirim</label><input type="date" id="ship" value="${$('#ship')?.value || new Date().toISOString().slice(0, 10)}">
      <label>Catatan</label><input id="note" value="${esc($('#note')?.value || '')}">
      ${warns.map(w => `<div class="alert bad" style="margin-top:8px">⚠ ${esc(w)}</div>`).join('')}
      <div class="sticky"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span>Total</span><b style="font-size:18px">${rp(total)}</b></div>
      <button class="btn full" id="send">${warns.length && ME.role !== 'owner' ? 'Kirim untuk persetujuan' : 'Simpan Order'}</button></div></div>` : ''}`;
    // pencarian pelanggan: daftar diperbarui tanpa menggambar ulang halaman supaya fokus ketik tidak hilang
    const cs = $('#cs');
    if (cs) {
      const showC = () => { const q = cs.value.toLowerCase().trim();
        const hits = ok.filter(c => !q || c.name.toLowerCase().includes(q) || (c.phone || '').includes(q)).slice(0, 30);
        $('#cl').innerHTML = hits.map(c => `<div class="item" data-c="${c.id}" style="cursor:pointer"><div><b>${esc(c.name)}</b><br><small class="mut">${esc(c.channel)} · ${c.price_group}${ME.role !== 'sales' ? ' · ' + esc(c.sales || 'Pemilik') : ''}</small></div>
          ${c.maxLate > 7 ? '<span class="tag bad">nunggak</span>' : c.piutang ? '<span class="tag warn">ada piutang</span>' : ''}</div>`).join('') || '<p class="mut">Tidak ditemukan</p>';
        $('#cl').querySelectorAll('[data-c]').forEach(d => d.onclick = () => { C = ok.find(c => c.id == d.dataset.c); draw(); }); };
      cs.oninput = showC; showC(); cs.focus();
    }
    const cx = $('#cx'); if (cx) cx.onclick = () => { C = null; draw(); };
    const ps = $('#ps'); if (ps) ps.oninput = () => { const q = ps.value.toLowerCase().trim();
      document.querySelectorAll('.item[data-name]').forEach(d => d.style.display = !q || d.dataset.name.includes(q) ? '' : 'none'); };
    document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; draw(); });
    document.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => { pay = b.dataset.pay; draw(); });
    const step = p => ({ butir: 100 })[prices.find(x => x.product_id == p).unit] || 1;
    document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const id = b.dataset.p; cart[id] = cart[id] || {}; cart[id].qty = (+cart[id].qty || 0) + step(id); draw(); });
    document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const id = b.dataset.m; if (cart[id]) cart[id].qty = Math.max(0, (+cart[id].qty || 0) - step(id)); draw(); });
    document.querySelectorAll('[data-q]').forEach(i => i.onchange = () => { const id = i.dataset.q; cart[id] = cart[id] || {}; cart[id].qty = +i.value || 0; draw(); });
    document.querySelectorAll('[data-d]').forEach(i => i.onchange = () => { cart[i.dataset.d].disc = +i.value || 0; draw(); });
    const s = $('#send'); if (s) s.onclick = async () => {
      const items = Object.entries(cart).filter(([, v]) => v.qty > 0).map(([id, v]) => ({ product_id: +id, qty: v.qty, discount: v.disc || 0 }));
      const r = await api('orders', { customer_id: C.id, items, pay_type: pay, ship_date: $('#ship').value, note: $('#note').value });
      toast(r.status === 'pending' ? `${r.no} dikirim ke Pak Benny untuk persetujuan` : `${r.no} tersimpan · ${rp(r.total)}`);
      location.hash = 'orders';
    };
  };
  draw();
};

// ---------- Daftar order ----------
V.orders = async () => {
  const o = await api('orders');
  $('#main').innerHTML = `<div class="card"><h3>Order (${o.length} terakhir)</h3><div class="scroll"><table><tr><th>Nota</th><th>Tgl</th><th>Pelanggan</th>${ME.role !== 'sales' ? '<th>Sales</th>' : ''}<th>Bayar</th><th>Status</th><th class="r">Total</th></tr>
  ${o.map(x => `<tr style="cursor:pointer" onclick="showOrder(${x.id})"><td>${x.no}</td><td>${x.date.slice(5)}</td><td>${esc(x.customer)}</td>${ME.role !== 'sales' ? `<td>${esc(x.sales || 'Pemilik')}</td>` : ''}

    <label>Saluran</label><select id="ch">${['Jabar', 'Lokal', 'Luar pulau', 'Modern market', 'Eceran'].map(v => `<option ${x.channel === v ? 'selected' : ''}>${v}</option>`).join('')}</select>

  const r = await api('returns');
  const canAp = ME.role === 'admin' || ME.role === 'owner';
  $('#main').innerHTML = `<div class="card"><h3>Retur</h3><p class="mut" style="margin-top:0">Catat retur dari detail nota (menu Order → klik nota → Catat retur).</p><div class="scroll"><table><tr><th>Tgl</th><th>Nota</th><th>Pelanggan</th><th>Produk</th><th>Alasan</th><th class="r">Nilai</th><th>Status</th></tr>
  ${r.map(x => `<tr><td>${x.date.slice(5)}</td><td>${x.no}</td><td>${esc(x.customer)}</td><td>${esc(x.code)} ${num(x.qty)}</td><td>${esc(x.reason)}</td><td class="r">${rp(x.amount)}</td>
  <td>${x.status === 'pending' && canAp ? `<button class="btn sm ok" onclick="apr(${x.id},1)">Setujui</button> <button class="btn sm bad" onclick="apr(${x.id},0)">Tolak</button>` : `<span class="tag ${x.status === 'approved' ? 'ok' : x.status === 'pending' ? 'warn' : 'bad'}">${x.status}</span>`}</td></tr>`).join('') || '<tr><td class="mut">Belum ada</td></tr>'}</table></div></div>`;
};
async function apr(id, ok) { await api('returns/approve', { id, ok }); toast('Tersimpan'); render(); }

// ---------- Kontak ----------
V.kontak = async () => {
  const [k, c] = await Promise.all([api('contacts'), api('customers')]);
  $('#main').innerHTML = `<div class="card"><h3>Catat kontak pelanggan</h3><input id="kq" placeholder="🔍 Ketik nama pelanggan…" autocomplete="off"><input type="hidden" id="kc"><div id="kl" style="max-height:240px;overflow:auto"></div>
  <label>Ditawari apa</label><input id="ko" placeholder="mis. AKM print promo"><label>Hasil</label><select id="kr"><option>Order</option><option>Pikir-pikir</option><option>Tidak berminat</option><option>Tidak bisa dihubungi</option></select>
  <button class="btn full" id="ks" style="margin-top:10px">Simpan</button></div>
  <div class="card"><h3>Riwayat</h3><table>${k.map(x => `<tr><td>${x.date.slice(5)}</td><td>${esc(x.customer)}</td><td>${esc(x.offer)}</td><td>${esc(x.result)}</td></tr>`).join('') || '<tr><td class="mut">Belum ada</td></tr>'}</table></div>`;
  const kq = $('#kq');
  kq.oninput = () => { $('#kc').value = ''; const q = kq.value.toLowerCase().trim();
    $('#kl').innerHTML = !q ? '' : c.filter(x => x.name.toLowerCase().includes(q)).slice(0, 20).map(x => `<div class="item" data-k="${x.id}" style="cursor:pointer"><span>${esc(x.name)}</span></div>`).join('') || '<p class="mut">Tidak ditemukan</p>';
    $('#kl').querySelectorAll('[data-k]').forEach(d => d.onclick = () => { $('#kc').value = d.dataset.k; kq.value = c.find(x => x.id == d.dataset.k).name; $('#kl').innerHTML = ''; }); };
  $('#ks').onclick = async () => { if (!$('#kc').value) return toast('Pilih pelanggan dari daftar'); await api('contacts', { customer_id: +$('#kc').value, offer: $('#ko').value, result: $('#kr').value }); toast('Tersimpan'); render(); };
};

// ---------- Disiplin ----------
V.disiplin = async () => {
  const [v, users] = await Promise.all([api('violations'), api('users')]);
  $('#main').innerHTML = `<div class="card"><h3>Catat pelanggaran disiplin</h3><p class="mut" style="margin-top:0">Sementara manual; nanti bisa dibaca dari mesin absen.</p>
  <select id="vs">${users.filter(u => u.role === 'sales').map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
  <label>Jenis</label><select id="vt"><option>Telat masuk</option><option>Telat kembali istirahat</option></select><label>Tanggal</label><input type="date" id="vd" value="${new Date().toISOString().slice(0, 10)}">
  <button class="btn full" id="vb" style="margin-top:10px">Simpan</button></div>
  <div class="card"><h3>Riwayat</h3><table>${v.map(x => `<tr><td>${x.date}</td><td>${esc(x.sales)}</td><td>${esc(x.type)}</td></tr>`).join('')}</table></div>`;
  $('#vb').onclick = async () => { await api('violations', { sales_id: +$('#vs').value, type: $('#vt').value, date: $('#vd').value }); toast('Tersimpan'); render(); };
};

// ---------- Produk ----------
V.produk = async () => {
  const p = await api('products');
  $('#main').innerHTML = `<div class="card"><h3>Produk</h3><table><tr><th>Kode</th><th>Nama</th><th>Satuan</th><th>Prioritas</th></tr>
  ${p.map(x => `<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${x.unit}</td><td>${x.priority ? '⭐' : ''}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>Tambah produk</h3><label>Kode</label><input id="pc"><label>Nama</label><input id="pn"><label>Satuan</label><select id="pu">${['butir', 'kg', 'tray', 'dos', 'ikat'].map(u => `<option>${u}</option>`).join('')}</select>
  <button class="btn full" id="pb" style="margin-top:10px">Tambah</button></div>`;
  $('#pb').onclick = async () => { await api('products', { code: $('#pc').value, name: $('#pn').value, unit: $('#pu').value }); toast('Ditambahkan'); render(); };
};

// ---------- Rekap & ekspor ----------
V.rekap = async () => {
  const r = await api('recap');
  $('#main').innerHTML = `<div class="card"><h3>Rekap harian otomatis</h3><p class="mut" style="margin-top:0">Pengganti rekap sore manual. Di versi jadi, teks ini dikirim otomatis ke WhatsApp Pak Benny tiap sore.</p>
  <pre id="rt">${esc(r.text)}</pre><button class="btn" id="cp">Salin untuk WhatsApp</button></div>`;
  $('#cp').onclick = () => { navigator.clipboard.writeText(r.text); toast('Disalin'); };
};
V.lain = async () => {
  const log = ME.role === 'finance' ? [] : await api('audit');
  $('#main').innerHTML = `<div class="card"><h3>Ekspor ke Excel</h3><div class="row">
  ${[['orders', 'Semua order'], ['piutang', 'Piutang'], ['pelanggan', 'Pelanggan']].map(([k, l]) => `<a class="btn ghost" href="/export/${k}?t=${TOKEN}">${l} (.csv)</a>`).join('')}</div></div>
  ${log.length ? `<div class="card"><h3>Log perubahan (200 terakhir)</h3><div class="scroll"><table>${log.map(a => `<tr><td class="mut">${a.ts.slice(0, 16).replace('T', ' ')}</td><td>${esc(a.name)}</td><td>${a.action}</td><td class="mut" style="font-size:11px">${esc(a.detail).slice(0, 120)}</td></tr>`).join('')}</table></div></div>` : ''}`;
};

render();
</script></body></html>
